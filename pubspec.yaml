name: TURF_TOWN_
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Image & Media
  image_picker: ^1.1.2

  # UI & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  flutter_svg: ^2.2.1
  carousel_slider: ^5.1.1
  lottie: ^3.1.0
  fl_chart: ^1.2.0

  # State management
  provider: ^6.1.5+1
  flutter_riverpod: ^3.3.1
  riverpod: ^3.2.1

  # Navigation
  go_router: ^17.2.3

  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Bluetooth
  flutter_blue_plus: ^1.32.0
  bluetooth_classic: ^0.0.4

  # Permissions & device info
  permission_handler: ^12.0.1
  device_info_plus: ^12.3.0

  # Storage — sqflite replaces ObjectBox
  sqflite: ^2.3.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.1
  path: ^1.8.3

  # File, PDF, Share
  pdf: ^3.10.4
  printing: ^5.11.0
  share_plus: ^12.0.2

  # Utilities
  uuid: ^4.5.3
  intl: ^0.20.2

  mobile_scanner: ^5.2.3

  # Firebase
  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.4.0
  google_sign_in: ^6.3.0
  loading_animation_widget: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  # build_runner kept for any other generators (e.g. go_router)
  build_runner: ^2.10.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/page1.png
    - assets/images/page2.png
    - assets/images/page3.png
    - assets/images/cri_slider.png
    - assets/images/foot_slider.png
